<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard — Ocean Portfolio</title>
  <!-- Quill Rich Text Editor CSS -->
  <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: #071324; color: #e2e8f0; min-height: 100vh; }

    /* Login Gate */
    #login-screen {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 20px;
    }
    .login-card {
      background: #0f233c; border: 1px solid #1e3a5f; border-radius: 12px;
      padding: 32px; width: 100%; max-width: 380px; text-align: center;
      box-shadow: 0 12px 32px rgba(0,0,0,0.4);
    }
    .login-card h1 { font-size: 1.4rem; margin-bottom: 8px; color: #38bdf8; }
    .login-card p { font-size: 0.9rem; color: #94a3b8; margin-bottom: 20px; }
    .login-card input {
      width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155;
      background: #071324; color: #fff; margin-bottom: 14px; font-size: 1rem;
    }
    .login-card button {
      width: 100%; padding: 12px; border: none; border-radius: 8px;
      background: #0284c7; color: #fff; font-weight: 600; cursor: pointer; font-size: 1rem;
    }
    .login-card button:hover { background: #0369a1; }
    #login-error { color: #f87171; font-size: 0.85rem; margin-top: 10px; display: none; }

    /* Dashboard Layout */
    #dashboard { display: none; max-width: 1100px; margin: 0 auto; padding: 24px; }
    header {
      display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center;
      gap: 12px; padding-bottom: 20px; border-bottom: 1px solid #1e3a5f; margin-bottom: 24px;
    }
    header h1 { font-size: 1.5rem; color: #38bdf8; }
    .header-actions { display: flex; gap: 10px; }
    .btn {
      padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer;
      font-weight: 600; font-size: 0.9rem; text-decoration: none; display: inline-block;
    }
    .btn-primary { background: #0284c7; color: #fff; }
    .btn-primary:hover { background: #0369a1; }
    .btn-secondary { background: #1e293b; color: #cbd5e1; border: 1px solid #334155; }
    .btn-danger { background: #dc2626; color: #fff; }
    .btn-edit { background: #d97706; color: #fff; }

    /* Depth Tabs (Ordered Shallow to Deepest) */
    .tabs {
      display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px;
    }
    .tab-btn {
      padding: 10px 14px; border-radius: 8px; border: 1px solid #1e3a5f;
      background: #0f233c; color: #94a3b8; cursor: pointer; font-weight: 600; font-size: 0.88rem;
    }
    .tab-btn.active { background: #0284c7; color: #fff; border-color: #38bdf8; }

    /* Main Grid */
    .panel-grid { display: grid; grid-template-columns: 1fr 1.2fr; gap: 24px; }
    @media (max-width: 820px) { .panel-grid { grid-template-columns: 1fr; } }

    .card {
      background: #0f233c; border: 1px solid #1e3a5f; border-radius: 12px; padding: 20px;
    }
    .card h2 { font-size: 1.15rem; margin-bottom: 16px; color: #7dd3fc; }

    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.85rem; color: #cbd5e1; margin-bottom: 6px; }
    .form-group input, .form-group textarea, .form-group select {
      width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #334155;
      background: #071324; color: #fff; font-size: 0.95rem;
    }
    .form-group textarea { min-height: 90px; resize: vertical; }

    /* Quill Editor Theme Overrides */
    #editor-wrapper { background: #fff; color: #0f172a; border-radius: 6px; overflow: hidden; }
    #quill-editor { height: 220px; font-size: 0.95rem; }

    /* Existing Items List */
    .item-list { display: flex; flex-direction: column; gap: 12px; }
    .item-card {
      background: #071324; border: 1px solid #1e3a5f; border-radius: 8px; padding: 14px;
    }
    .item-card h3 { font-size: 1rem; color: #38bdf8; margin-bottom: 4px; }
    .item-meta { font-size: 0.82rem; color: #94a3b8; margin-bottom: 8px; }
    .item-desc { font-size: 0.9rem; color: #cbd5e1; margin-bottom: 10px; }
    .item-actions { display: flex; gap: 8px; }
    .status-toast {
      position: fixed; bottom: 20px; right: 20px; background: #059669; color: #fff;
      padding: 12px 18px; border-radius: 8px; font-weight: 600; display: none; z-index: 999;
    }
  </style>
</head>
<body>

  <!-- Login Screen -->
  <div id="login-screen">
    <div class="login-card">
      <h1>Ocean Depth Admin</h1>
      <p>Enter your admin password to manage your portfolio content.</p>
      <form id="login-form">
        <input type="password" id="admin-pass-input" placeholder="Admin Password" required />
        <button type="submit">Unlock Dashboard</button>
      </form>
      <div id="login-error">Incorrect password. Try again.</div>
    </div>
  </div>

  <!-- Admin Dashboard -->
  <div id="dashboard">
    <header>
      <div>
        <h1>Portfolio Content Manager</h1>
        <small style="color:#94a3b8;">Ordered from Shallow Waters to the Ocean Abyss</small>
      </div>
      <div class="header-actions">
        <a href="/" target="_blank" class="btn btn-secondary">View Live Ocean Portfolio ↗</a>
        <button id="logout-btn" class="btn btn-danger">Lock</button>
      </div>
    </header>

    <!-- 7 Sections in Exact Depth Order -->
    <div class="tabs" id="section-tabs">
      <button class="tab-btn active" data-section="education">1. Education</button>
      <button class="tab-btn" data-section="interests">2. Interests</button>
      <button class="tab-btn" data-section="skills">3. Skills</button>
      <button class="tab-btn" data-section="projects">4. Projects</button>
      <button class="tab-btn" data-section="achievements">5. Achievements</button>
      <button class="tab-btn" data-section="digitalFootprints">6. Digital Footprints</button>
      <button class="tab-btn" data-section="articles">7. Articles (Rich Editor)</button>
    </div>

    <div class="panel-grid">
      <!-- Add / Edit Form -->
      <div class="card">
        <h2 id="form-title">Add New Education Entry</h2>
        <form id="dynamic-form">
          <div id="form-fields"></div>
          <div style="display:flex; gap:10px; margin-top:16px;">
            <button type="submit" class="btn btn-primary" id="save-btn">Save Entry</button>
            <button type="button" class="btn btn-secondary" id="cancel-edit-btn" style="display:none;">Cancel Edit</button>
          </div>
        </form>
      </div>

      <!-- Current Saved Entries -->
      <div class="card">
        <h2 id="list-title">Saved Education Entries</h2>
        <div class="item-list" id="items-container"></div>
      </div>
    </div>
  </div>

  <div class="status-toast" id="toast">Saved!</div>

  <!-- Quill Rich Text Editor JS -->
  <script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
  <script src="/admin.js"></script>
</body>
</html>
